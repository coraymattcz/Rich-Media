<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hampy Wasi - Spa Mágico</title>
    <style>
        /* ================= VARIABLES & ESTILO ================= */
        :root {
            --hw-azul: #1e8fa2;
            --hw-verde: #7caf53;
            --madera-clara: #e4c49d;
            --madera-oscura: #b38253;
            --madera-marco: #8a5a32;
            --luz-tarde: rgba(255, 240, 200, 0.4);
            --rojo-estres: #ff6b6b; 
            --rojo-furia: #ee5253;
            --amarillo-alivio: #feca57;
            --verde-feliz: var(--hw-verde);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #1a252f; overflow: hidden;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
            margin: 0;
        }

        /* ================= CONTENEDOR RESPONSIVO ================= */
        #ad-container {
            position: relative; width: 100%; height: 100dvh; max-width: 480px; 
            background-color: var(--madera-clara); overflow: hidden; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        }

        @media (min-width: 600px) {
            #ad-container { height: 90vh; max-height: 850px; border-radius: 20px; }
        }

        /* ================= PANTALLA DE INICIO (Logo) ================= */
        #intro-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 300;
            transition: opacity 1.5s ease-in-out;
        }

        /* ESTILO DEL LOGO: CIRCULAR */
        .brand-logo-img { 
            width: 180px; 
            height: 180px; /* Altura igual al ancho para hacer el círculo */
            object-fit: cover; /* Evita que la imagen se deforme */
            border-radius: 50%; /* Esto hace que sea un círculo perfecto */
            margin-bottom: 40px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); 
            border: 4px solid var(--hw-azul); /* Borde decorativo */
            background-color: white;
        }

        .start-btn {
            font-family: 'Segoe UI', sans-serif; background: var(--hw-azul); color: white;
            border: none; padding: 15px 35px; border-radius: 40px; font-size: 18px; font-weight: bold;
            cursor: pointer; box-shadow: 0 8px 20px rgba(30, 143, 162, 0.4);
            transition: transform 0.3s, background 0.3s;
        }
        .start-btn:hover { background: #156d7c; transform: scale(1.05); }

        /* ================= ESCENARIO DEL SPA ================= */
        .wall {
            position: absolute; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, rgba(179, 130, 83, 0.2), rgba(179, 130, 83, 0.2) 30px, rgba(138, 90, 50, 0.1) 30px, rgba(138, 90, 50, 0.1) 32px);
            z-index: 1;
        }

        .sun-ray {
            position: absolute; top: -10%; left: -20%; width: 150%; height: 150%;
            background: linear-gradient(135deg, var(--luz-tarde) 0%, transparent 60%);
            z-index: 2; pointer-events: none;
        }

        /* Estantería y Camilla */
        .shelf-container { position: absolute; top: 35%; width: 100%; height: 60px; z-index: 3; display: flex; align-items: flex-end; justify-content: center; }
        .shelf-board { position: absolute; bottom: 0; left: 0; width: 100%; height: 12px; background: var(--madera-marco); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .shelf-items { display: flex; width: 100%; max-width: 320px; align-items: flex-end; padding: 0 20px; justify-content: space-between; z-index: 4; margin-bottom: 2px; }
        .bottles { display: flex; gap: 4px; }
        .bottle { width: 14px; height: 28px; background: var(--hw-azul); border-radius: 3px 3px 0 0; position: relative; }
        .bottle::after { content: ''; position: absolute; top: -5px; left: 4px; width: 6px; height: 5px; background: #fff; border-radius: 2px; }
        .towels { display: flex; flex-direction: column; gap: 2px; }
        .towel-stack { width: 35px; height: 9px; background: #fff; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .plant { position: relative; width: 25px; height: 30px; }
        .pot { position: absolute; bottom: 0; width: 22px; height: 12px; background: #d35400; border-radius: 2px 2px 5px 5px; left: 1.5px; }
        .leaf { position: absolute; top: 5px; width: 12px; height: 15px; background: var(--hw-verde); border-radius: 0 10px 0 10px; }
        .leaf:nth-child(2) { left: -5px; transform: rotate(-30deg); }
        .leaf:nth-child(3) { right: -5px; transform: rotate(30deg); top: 8px; }

        .massage-bed-container { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 300px; z-index: 5; }
        .bed-legs { display: flex; justify-content: space-between; padding: 0 20px; }
        .leg { width: 14px; height: 40px; background: var(--madera-marco); border-radius: 2px; }
        .bed-base { width: 100%; height: 20px; background: var(--madera-oscura); border-radius: 4px; position: absolute; bottom: 35px; }
        .bed-mattress { width: 102%; height: 28px; background: #fff; left: -1%; border-radius: 12px; position: absolute; bottom: 53px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); }

        /* ================= EL ESPÍRITU ================= */
        #character-container { position: absolute; bottom: 125px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; }
        #character { width: 110px; height: 95px; background-color: var(--rojo-estres); border-radius: 45% 55% 40% 60% / 60% 60% 40% 40%; position: relative; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 10px 15px rgba(0,0,0,0.2); transition: background-color 0.6s, border-radius 0.6s; animation: breathe 3s infinite ease-in-out; display: flex; justify-content: center; align-items: center; }
        @keyframes breathe { 0%, 100% { transform: scale(1, 1) translateY(0); border-radius: 45% 55% 40% 60% / 60% 60% 40% 40%; } 50% { transform: scale(1.05, 0.95) translateY(3px); border-radius: 50% 50% 45% 55% / 55% 55% 45% 45%; } }
        .ear { position: absolute; top: -12px; width: 20px; height: 35px; background: inherit; border-radius: 50% 50% 0 0; z-index: -1; transition: transform 0.4s; }
        .ear.left { left: 20px; transform: rotate(-25deg); }
        .ear.right { right: 20px; transform: rotate(25deg); }
        .face { position: absolute; top: 30px; width: 60px; height: 35px; display: flex; flex-direction: column; align-items: center; z-index: 20; }
        .eyes { display: flex; gap: 15px; width: 100%; justify-content: center; transition: all 0.5s; }
        .eye { width: 12px; height: 14px; background: #2d3436; border-radius: 50%; position: relative; overflow: hidden; }
        .eye::after { content: ''; position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; background: #fff; border-radius: 50%; } 
        .brow { position: absolute; top: -10px; width: 14px; height: 4px; background: #2d3436; border-radius: 3px; transition: all 0.5s; }
        .eye.left .brow { left: -2px; transform: rotate(20deg); }
        .eye.right .brow { right: -2px; transform: rotate(-20deg); }
        .mouth { width: 12px; height: 8px; border: 3px solid #2d3436; border-top: none; border-radius: 0 0 15px 15px; margin-top: 6px; transition: all 0.5s; transform: rotate(180deg); }

        #character.super-red { background-color: var(--rojo-furia); animation: furiousShake 0.4s infinite; }
        @keyframes furiousShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
        #character.super-red .ear.left { transform: rotate(-50deg) translateY(10px); }
        #character.super-red .ear.right { transform: rotate(50deg) translateY(10px); }
        #character.super-red .eye.left .brow { transform: rotate(40deg) translateY(4px); }
        #character.super-red .eye.right .brow { transform: rotate(-40deg) translateY(4px); }
        #character.super-red .mouth { width: 18px; height: 12px; border-radius: 10px; background: #2d3436; }

        #character.yellow { background-color: var(--amarillo-alivio); }
        #character.yellow .eye.left .brow { transform: rotate(0deg) translateY(-2px); }
        #character.yellow .eye.right .brow { transform: rotate(0deg) translateY(-2px); }
        #character.yellow .mouth { width: 16px; height: 4px; border: 3px solid #2d3436; border-radius: 4px; transform: rotate(0deg); background: #2d3436; }

        #character.green { background-color: var(--verde-feliz); border-radius: 50% 50% 45% 55% / 50% 50% 50% 50%; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1), 0 0 25px rgba(124, 175, 83, 0.8); }
        #character.green .ear.left { transform: rotate(-5deg) translateY(-3px); }
        #character.green .ear.right { transform: rotate(5deg) translateY(-3px); }
        #character.green .eye.left .brow { transform: rotate(-15deg) translateY(-6px); }
        #character.green .eye.right .brow { transform: rotate(15deg) translateY(-6px); }
        #character.green .mouth { transform: rotate(0deg); border-top: none; height: 12px; width: 20px; border-radius: 0 0 20px 20px; background: #ff7675; }

        /* ================= ORBES ================= */
        #bubbles-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 30; }
        .bubble-wrapper { position: absolute; bottom: -80px; pointer-events: auto; }
        .bubble { width: 70px; height: 70px; background: rgba(255,255,255,0.3); backdrop-filter: blur(3px); border: 2px solid rgba(255,255,255,0.9); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 34px; box-shadow: 0 0 15px rgba(255,255,255,0.5), inset 0 0 15px rgba(255,255,255,0.7); cursor: pointer; transition: transform 0.1s; }
        .bubble:active { transform: scale(0.85); }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(-5deg); } 100% { transform: translateY(-900px) rotate(5deg); } }

        .falling-item { position: absolute; font-size: 34px; z-index: 50; pointer-events: none; transition: top 0.4s cubic-bezier(0.55, 0.085, 0.68, 0.53), left 0.4s linear; }
        .particle { position: absolute; width: 8px; height: 8px; pointer-events: none; border-radius: 50%; animation: pop 0.8s ease-out forwards; z-index: 100; box-shadow: 0 0 8px currentColor; }
        @keyframes pop { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

        #instruction { position: absolute; top: 12%; width: 100%; text-align: center; color: #2c3e50; font-weight: bold; font-size: 22px; z-index: 5; text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px #fff; animation: pulseText 2.5s infinite; pointer-events: none; opacity: 0; transition: opacity 1s; }
        @keyframes pulseText { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        /* ================= FIN ================= */
        #end-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 1s ease-in-out; z-index: 200; padding: 30px; text-align: center; }
        #end-screen.active { opacity: 1; pointer-events: auto; }
        .mensaje { font-size: 26px; color: var(--hw-azul); font-weight: bold; margin-bottom: 15px; line-height: 1.2; }
        .sub-mensaje { font-size: 16px; color: #576574; margin-bottom: 35px; font-style: italic; }
        .cta-btn { font-family: 'Segoe UI', sans-serif; background: var(--hw-verde); color: white; text-decoration: none; padding: 15px 30px; border-radius: 40px; font-size: 17px; font-weight: bold; text-transform: uppercase; box-shadow: 0 8px 20px rgba(124, 175, 83, 0.5); }
    </style>
</head>
<body>

    <div id="ad-container">
        
        <!-- PANTALLA DE INICIO -->
        <div id="intro-screen">
            <!-- NUEVO LOGO -->
            <img src="https://drive.google.com/thumbnail?id=1-b923djWBey8tKHfkvz_vI864kGLl6WS&sz=w500" alt="Hampy Wasi Logo" class="brand-logo-img">
            
            <button class="start-btn" id="start-btn">Entrar al Spa ✨</button>
        </div>

        <!-- ESCENARIO SPA -->
        <div class="wall"></div>
        <div class="sun-ray"></div>
        
        <div class="shelf-container">
            <div class="shelf-items">
                <div class="bottles"><div class="bottle"></div><div class="bottle" style="height: 20px; background: var(--hw-verde);"></div><div class="bottle" style="height: 24px;"></div></div>
                <div class="towels"><div class="towel-stack"></div><div class="towel-stack"></div><div class="towel-stack"></div></div>
                <div class="plant"><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="pot"></div></div>
            </div>
            <div class="shelf-board"></div>
        </div>

        <div class="massage-bed-container">
            <div class="bed-legs"><div class="leg"></div><div class="leg"></div></div>
            <div class="bed-base"></div>
            <div class="bed-mattress"></div>
        </div>

        <div id="instruction">Toca los orbes para<br>relajar su espíritu ✨</div>

        <div id="character-container">
            <div id="character">
                <div class="ear left"></div><div class="ear right"></div>
                <div class="face">
                    <div class="eyes">
                        <div class="eye left"><div class="brow"></div></div>
                        <div class="eye right"><div class="brow"></div></div>
                    </div>
                    <div class="mouth"></div>
                </div>
            </div>
        </div>

        <div id="bubbles-container"></div>

        <!-- PANTALLA FINAL -->
        <div id="end-screen">
            <!-- NUEVO LOGO -->
            <img src="https://drive.google.com/thumbnail?id=1-b923djWBey8tKHfkvz_vI864kGLl6WS&sz=w500" alt="Hampy Wasi Logo" class="brand-logo-img">
            
            <div class="mensaje">Renueva tu energía<br>y descansa tu espíritu.</div>
            <div class="sub-mensaje">Disfruta de la magia de la relajación.</div>
            <a href="https://wa.me/51976241230?text=Hola%20Hampy%20Wasi%2C%20quiero%20agendar%20mi%20masaje." target="_blank" class="cta-btn">Agendar mi Cita</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('ad-container');
        const bubbleContainer = document.getElementById('bubbles-container');
        const character = document.getElementById('character');
        const endScreen = document.getElementById('end-screen');
        const instruction = document.getElementById('instruction');
        const introScreen = document.getElementById('intro-screen');

        let score = 0;
        let gameActive = false; 
        let isFurious = false; 
        let instructionShown = false;
        let audioCtx;

        const elements = [
            { icon: '🌿', type: 'good' }, { icon: '🧴', type: 'good' }, { icon: '🪔', type: 'good' },
            { icon: '💆‍♀️', type: 'good' }, { icon: '🕯️', type: 'good' }, { icon: '🪷', type: 'good' },
            { icon: '🍃', type: 'good' }, { icon: '♨️', type: 'good' },
            { icon: '📩', type: 'bad' }, { icon: '⏰', type: 'bad' }, { icon: '📱', type: 'bad' }, { icon: '💼', type: 'bad' }
        ];

        document.getElementById('start-btn').addEventListener('click', () => {
            
            // 1. Efectos de sonido sintetizados (Los "pops" mágicos al tocar)
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if(AudioContext) {
                audioCtx = new AudioContext();
            }

            // 2. MÚSICA DE FONDO RELAJANTE (MP3 optimizado desde Pixabay)
            const bgMusic = new Audio('https://cdn.pixabay.com/audio/2022/02/07/audio_d0fa6afae4.mp3');
            bgMusic.crossOrigin = "anonymous";
            bgMusic.loop = true;
            bgMusic.volume = 0.5; // Volumen al 50% (lo ideal para fondo)
            
            // Inicia la música de fondo exactamente al hacer clic
            bgMusic.play().catch(e => console.error("Error reproduciendo música:", e));
            
            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.display = 'none';
                instruction.style.opacity = '1';
                gameActive = true;
                instructionShown = true;
                spawnBubble();
            }, 1000);
        });

        // GENERADOR DE SONIDOS SINTETIZADOS (100% garantizado en todos los navegadores)
        function playSfx(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'good') {
                // Sonido mágico / campanita
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                // Sonido de error grave
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function spawnBubble() {
            if (!gameActive) return;
            const item = elements[Math.floor(Math.random() * elements.length)];
            const wrapper = document.createElement('div');
            wrapper.className = 'bubble-wrapper';
            
            const leftPos = Math.random() * (container.offsetWidth - 90) + 10;
            wrapper.style.left = leftPos + 'px';
            const duration = 4.5 + Math.random() * 2.5;
            wrapper.style.animation = `floatUp ${duration}s linear forwards`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = item.icon;
            
            bubble.addEventListener('pointerdown', (e) => {
                if(!gameActive || isFurious) return;
                e.preventDefault();
                playSfx(item.type); // Suena el efecto mágico al tocar
                popBubble(bubble, wrapper, item.icon, item.type);
            });

            wrapper.appendChild(bubble);
            bubbleContainer.appendChild(wrapper);

            wrapper.addEventListener('animationend', () => {
                if (wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
            });

            setTimeout(spawnBubble, 800 + Math.random() * 700);
        }

        function popBubble(bubble, wrapper, icon, type) {
            if(instructionShown) { instruction.style.opacity = '0'; instructionShown = false; }

            const rect = bubble.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            
            createParticles(bubble, 6, ['#ffffff', '#f1c40f', '#1dd1a1']);
            wrapper.remove();

            const fallingItem = document.createElement('div');
            fallingItem.className = 'falling-item';
            fallingItem.innerText = icon;
            fallingItem.style.left = (rect.left - containerRect.left + 15) + 'px';
            fallingItem.style.top = (rect.top - containerRect.top + 15) + 'px';
            container.appendChild(fallingItem);

            const charRect = character.getBoundingClientRect();
            const targetX = charRect.left - containerRect.left + (charRect.width / 2) - 15;
            const targetY = charRect.top - containerRect.top - 20;

            fallingItem.offsetHeight; 
            fallingItem.style.left = targetX + 'px';
            fallingItem.style.top = targetY + 'px';

            setTimeout(() => { fallingItem.remove(); processHit(type); }, 400);
        }

        function processHit(type) {
            if (!gameActive) return;
            if (type === 'good') {
                score++;
                createParticles(character, 10, ['#ffffff', '#7caf53', '#feca57']);
                updateCharacterState();
            } else {
                isFurious = true;
                score = Math.max(0, score - 1);
                character.className = 'super-red'; 
                createParticles(character, 12, ['#ee5253', '#ff6b6b', '#2c3e50']);
                setTimeout(() => { isFurious = false; if(gameActive) updateCharacterState(); }, 1200);
            }
        }

        function updateCharacterState() {
            if (score === 0) character.className = ''; 
            else if (score === 1) character.className = 'yellow'; 
            else if (score >= 3) {
                character.className = 'green';
                gameActive = false;
                setTimeout(() => createParticles(character, 35, ['#7caf53', '#1e8fa2', '#ffffff', '#e4c49d']), 200);
                setTimeout(() => {
                    playSfx('good');
                    setTimeout(() => playSfx('good'), 150);
                    setTimeout(() => playSfx('good'), 300);
                }, 200);
                setTimeout(() => endScreen.classList.add('active'), 1500);
            }
        }

        function createParticles(targetEl, count = 8, colors = ['#fff']) {
            const rect = targetEl.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const centerX = rect.left - containerRect.left + (rect.width / 2);
            const centerY = rect.top - containerRect.top + (rect.height / 2);

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = centerX + 'px';
                p.style.top = centerY + 'px';
                p.style.color = colors[Math.floor(Math.random() * colors.length)];
                p.style.background = p.style.color;
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 60;
                p.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                p.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                container.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }
    </script>
</body>
</html>
